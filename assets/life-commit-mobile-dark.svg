<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img" aria-labelledby="title desc">
 <title id="title">Progress does not always get committed.</title>
 <desc id="desc">An animated, illustrated commit form cycles through designing, coding, training, managing and making money. The colored activity map is a creative illustration of life beyond GitHub.</desc>
 <style>
 .mode{opacity:0;animation:mode 25s infinite}.phase-0{animation-delay:0s}.phase-1{animation-delay:-20s}.phase-2{animation-delay:-15s}.phase-3{animation-delay:-10s}.phase-4{animation-delay:-5s}
 @keyframes mode{0%,17%{opacity:1}19%,99%{opacity:0}100%{opacity:1}}
 .cursor{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:0}}
 .progress{transform-origin:54px 0;animation:progress 5s linear infinite}@keyframes progress{0%{transform:scaleX(.02)}100%{transform:scaleX(1)}}
 .spark{animation:spark 2.7s ease-in-out infinite}@keyframes spark{0%,100%{opacity:.38}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.mode,.cursor,.progress,.spark{animation:none}.mode{opacity:0}.phase-0{opacity:1}}
 </style>
