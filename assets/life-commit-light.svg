 .cursor{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:0}}
 .progress{transform-origin:68px 0;animation:progress 5s linear infinite}@keyframes progress{0%{transform:scaleX(.02)}100%{transform:scaleX(1)}}
